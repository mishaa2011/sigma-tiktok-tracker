<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход администратора</title><link rel="stylesheet" href="/static/style.css"></head><body><header class="top"><a class="brand" href="/">{{ cfg.site_name }}</a></header><main class="wrap narrow"><div class="card"><div class="eyebrow">RESTRICTED AREA</div><h1>Панель администратора</h1><p class="muted">Введи пароль, заданный в настройках сервера.</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post" action="/admin/login"><label>Пароль<input type="password" name="password" required autocomplete="current-password"></label><button class="primary" type="submit">Войти</button></form><p class="fine">Пароль не хранится в HTML. Перед публикацией настрой ADMIN_PASSWORD и SESSION_SECRET.</p></div></main></body></html>
